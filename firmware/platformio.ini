; PlatformIO config for uaDASH fork, targeting Waveshare ESP32-S3-Touch-LCD-7
;
; This mirrors the arduino-cli command that already compiled and flashed successfully:
;   arduino-cli -j16 compile -b esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,EventsCore=0 ...
;
; NOTE: board_build.partitions references the Arduino-core partition CSV by name.
; If PlatformIO can't resolve "app3M_fat9M_16MB.csv" automatically, copy it from
; your Arduino15 install (search for it under the esp32 core's "tools/partitions" folder,
; same path family as boot_app0.bin was found in during the arduino-cli upload)
; into this project's root and reference it as a local file instead. Verify this
; is the actual filename in the arduino-esp32 core — untested here.

[env:waveshare-s3-lcd7]
; Pinned to the exact Arduino core version (3.2.1) that arduino-cli used
; successfully - "stable" pulls the newest release (3.3.11 as of writing),
; which is too new for LovyanGFX 1.2.0's GPIO HAL calls (gpio_hal_iomux_func_sel
; was renamed/removed in newer ESP-IDF). Pin, don't chase latest, here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM / partitioning (mirrors your working arduino-cli flags) ---
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; --- Board-select macro + LVGL config lookup + optimization ---
; LV_CONF_INCLUDE_SIMPLE tells LVGL to do a plain #include "lv_conf.h"
; instead of a relative "../../lv_conf.h" path that doesn't match how
; PlatformIO nests the library under .pio/libdeps/ - without this flag
; LVGL can't find the lv_conf.h that's sitting in src/.
;
; -DCORE_DEBUG_LEVEL=0 (2026-09-19, splash truck-revolve bring-up): this
; project never set this before, so the platform's own default (non-zero
; on this board/platform combo) was silently active. Found on real
; hardware chasing a slow (~2 minutes for 22 frames, ~32KB/s) SD preload:
; the ESP32 Arduino SD library calls digitalWrite()/pinMode() on the CS
; pin ONCE PER SECTOR even though SD_CS is passed as -1 ("externally
; managed" - see sd_driver.h/.cpp, CS is actually asserted once via the
; CH422G and deliberately never toggled per-transaction). That call always
; fails against the invalid pin (logged as pin 255) - CLAUDE.md already
; documented this exact pinMode/digitalWrite-on-255 quirk as "a few
; harmless warnings at boot," which was true until something read enough
; SD sectors in one call for it to matter: at ~400 sectors/frame x 22
; frames, the framework's own log_e()/log_w() macros (esp32-hal-log.h,
; gated by CORE_DEBUG_LEVEL at compile time) were doing ~14,000 multi-line
; error prints - THAT formatting/UART overhead, not the actual SPI
; transfer, was almost the entire ~6.2s/frame cost. Setting this to 0
; (NONE) compiles log_e/log_w down to a true no-op (see esp32-hal-log.h) -
; the underlying failed pin write still happens (harmless, unchanged
; behavior), it just stops being expensive to fail. Applies to every
; environment (base + cantrace + mock-gps all inherit this) since the
; underlying SD-access pattern - and therefore this cost - isn't specific
; to the mock build.
build_flags =
    -DWAVESHARE_S3_LCD7
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -O2

; gps_mock_source.cpp defines the same gps_init()/gps_poll()/gpsData
; symbols as gps_driver.cpp (see [env:mock-gps] below) - excluded here so
; the normal/cantrace builds never link both and hit a duplicate-symbol
; error. cantrace inherits this via `extends` without needing to repeat it.
build_src_filter =
    +<*>
    -<gps_mock_source.cpp>

; --- Libraries ---
; ESP32_IO_Expander (+ its esp-lib-utils dep) was REMOVED on purpose.
; Its CH422G wrapper is built on ESP-IDF's new i2c_master ("driver_ng")
; driver and pulls in Arduino Wire (esp32-hal-i2c-ng.c -> i2c_master.c).
; LovyanGFX's GT911 touch uses the LEGACY driver/i2c.c, whose boot-time
; constructor check_i2c_driver_conflict() calls abort() the instant both
; drivers are linked into the same image -> faint-backlight boot loop:
;   "E i2c: CONFLICT! driver_ng is not allowed to be used with this old driver"
; Merely not #including the wrapper is not enough: an explicit lib_deps
; entry is still compiled and force-linked (global ctors in
; esp_expander_base.cpp). The CH422G is now driven directly from
; display_driver.cpp via lgfx::i2c (legacy path), so the library is gone.
lib_deps =
    lvgl@8.4.0
    lovyan03/LovyanGFX@1.2.0
    mikalhart/TinyGPSPlus@1.1.0  ; NMEA parsing for gps_driver.cpp - pure C++,
                                  ; no low-level driver hooks, none of the
                                  ; I2C/Wire conflict class of bug applies here

; Keep Arduino Wire OUT of the link. LovyanGFX's esp32 common.cpp has
;   #if __has_include(<Wire.h>)  ->  #include <Wire.h>
; convenience blocks; PlatformIO's LDF then compiles+links the whole Wire
; library (arduino-cli's LDF did not, which is why the original build was
; fine). Wire pulls esp32-hal-i2c-ng.c -> the new i2c_master ("driver_ng")
; driver, which aborts at boot next to LovyanGFX's own legacy driver/i2c.c
; (GT911 touch). Ignoring Wire makes __has_include(<Wire.h>) false, so
; LovyanGFX uses only the legacy path and the two-driver conflict is gone.
; NOTE: any future I2C device (e.g. the dyno-screen IMU) must likewise use
; the legacy driver / lgfx::i2c, not Wire, or this conflict returns.
lib_ignore = Wire

monitor_speed = 115200
upload_speed = 921600

; If arduino-cli's upload worked via manual BOOT/RESET button sequence,
; PlatformIO's auto-reset may also fail the same way on first flash.
; If `pio run -t upload` times out the same way esptool did, use the same
; manual BOOT+RESET button sequence during the "Connecting..." phase.
; (On Rob's board auto-reset over the CH343 works fine - not needed.)


; ===========================================================================
; [env:cantrace] - bench/diagnostics build
; ===========================================================================
; Identical to the normal build plus -DCAN_TRACE, which turns on verbose CAN
; logging on UART0 @ 115200: every raw RX frame, every decoded broadcast field
; (name / raw / scaled / unit), every SDO request + response, and a 1 Hz dump
; of the whole telemetry struct. Use it for milestone 2 (see firmware/can-bench.md):
;   pio run -e cantrace -t upload && pio device monitor -e cantrace
; The normal [env:waveshare-s3-lcd7] build is unchanged and ships no tracing.
[env:cantrace]
extends = env:waveshare-s3-lcd7
build_flags =
    ${env:waveshare-s3-lcd7.build_flags}
    -DCAN_TRACE


; ===========================================================================
; [env:mock-gps] - dev build with a canned GPS route instead of a real module
; ===========================================================================
; Same board/screens/everything as the shipping build, except gps_driver.cpp
; is swapped for gps_mock_source.cpp (single build-time switch point - see
; that file's header comment) so the GPS/nav screens can be built and
; visually verified on real hardware before a physical GPS module exists.
; Never used for the actual dashboard - flash back to [env:waveshare-s3-lcd7]
; before putting the board back in the vehicle or on the bench for real use.
;   pio run -e mock-gps -t upload
; -DDEBUG (2026-09-19, splash truck-revolve bring-up) turns on this
; project's Serial diagnostic logging (firmware.ino's own DEBUG-gated
; prints, ui_splash_truck.cpp's PSRAM-preload/SD-fallback trace, etc.) -
; this env is a dev/bench build already, so there's no real-use downside
; the way there would be adding this to the shipping build. Monitor with
; `pio device monitor -e mock-gps` (115200 baud) after flashing.
[env:mock-gps]
extends = env:waveshare-s3-lcd7
build_flags =
    ${env:waveshare-s3-lcd7.build_flags}
    -DDEBUG
build_src_filter =
    +<*>
    -<gps_driver.cpp>


; ===========================================================================
; [env:waveshare-s3-lcd7-test] - on-device tests that need real src/ code
; ===========================================================================
; PlatformIO's test runner does NOT pull in src/ by default (only the
; test/<name>/ folder + lib_deps), so test_nav_tile's calls to
; sd_available()/nav_tile_load() failed to link ("undefined reference")
; against plain [env:waveshare-s3-lcd7]. `test_build_src = true` fixes
; that; firmware.ino's own setup()/loop() are guarded with `#ifndef
; UNIT_TEST` (PlatformIO auto-defines UNIT_TEST for test builds) so they
; don't collide with test_nav_tile.cpp's setup()/loop() at link time.
; Kept as a separate env (rather than adding test_build_src to
; [env:waveshare-s3-lcd7] directly) so test_gps_parsing - which needs
; none of this, it talks to TinyGPSPlus directly - keeps building exactly
; as before under the plain env.
;   pio test -e waveshare-s3-lcd7-test -f test_nav_tile
[env:waveshare-s3-lcd7-test]
extends = env:waveshare-s3-lcd7
test_build_src = true