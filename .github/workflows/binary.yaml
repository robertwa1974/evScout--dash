name: dash-fw

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          pip install -U platformio "click<8.2"

      - name: Build
        run: pio run -e waveshare-s3-lcd7

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dash_waveshare-s3-lcd7
          path: |
            firmware/.pio/build/waveshare-s3-lcd7/firmware.bin
            firmware/.pio/build/waveshare-s3-lcd7/bootloader.bin
            firmware/.pio/build/waveshare-s3-lcd7/partitions.bin
