name: web-flasher

# Builds the shipping firmware and publishes the 1-click web installer
# (web-flasher/, ESP Web Tools) to the gh-pages branch.
#   - v* tag:          deploy the installer AND create a GitHub Release with
#                      firmware.bin (for the dash's WiFi /update page) and a
#                      full merged image (blank boards / esptool only).
#   - manual run:      redeploy the installer from the chosen ref, no release.
# Plain pushes to main don't redeploy, so the installer always serves a
# released build. DASH_TAG in firmware/src/build_info.h must match the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-flasher
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read firmware version
        run: |
          VERSION=$(sed -n 's/^#define DASH_TAG "\(.*\)".*/\1/p' firmware/src/build_info.h)
          if [ -z "$VERSION" ]; then
            echo "ERROR: DASH_TAG not found in firmware/src/build_info.h"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "ERROR: tag $GITHUB_REF_NAME but DASH_TAG is $VERSION - set DASH_TAG before tagging"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: |
          pip install -U platformio "click<8.2" "esptool>=5,<6"

      - name: Build
        working-directory: firmware
        run: pio run -e waveshare-s3-lcd7

      # -----------------------------------------------------------------------
      # Offsets from app3M_fat9M_16MB.csv (board_build.partitions):
      #   bootloader  0x0000
      #   partitions  0x8000
      #   nvs         0x9000   <- deliberately NOT written (settings, odometer)
      #   boot_app0   0xe000   (otadata: boot app0 even after a WiFi update)
      #   app0        0x10000
      # -----------------------------------------------------------------------
      - name: Collect binaries
        run: |
          BUILD_DIR=firmware/.pio/build/waveshare-s3-lcd7
          BOOT_APP0=$(find ~/.platformio/packages -path '*framework-arduinoespressif32*' -name boot_app0.bin 2>/dev/null | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin not found in the Arduino framework package"
            exit 1
          fi
          mkdir -p deploy
          cp $BUILD_DIR/bootloader.bin $BUILD_DIR/partitions.bin $BUILD_DIR/firmware.bin deploy/
          cp "$BOOT_APP0" deploy/boot_app0.bin
          cp web-flasher/index.html web-flasher/manifest.json deploy/
          sed -i "s/__VERSION__/$VERSION/g" deploy/index.html deploy/manifest.json
          ls -la deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "Deploy web flasher ${{ env.VERSION }}"

      # Full merged image for the release only - it runs from 0x0 through the
      # end of the app with the NVS gap filled with 0xFF, so flashing it
      # erases settings and the odometer.
      - name: Build release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp deploy/firmware.bin release/firmware.bin
          esptool --chip esp32s3 merge-bin \
            --output release/scout80-dash-$VERSION-full.bin \
            --flash-mode keep --flash-size 16MB \
            0x0     deploy/bootloader.bin \
            0x8000  deploy/partitions.bin \
            0xe000  deploy/boot_app0.bin \
            0x10000 deploy/firmware.bin
          ls -la release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Scout 80 dash ${{ env.VERSION }}
          files: |
            release/firmware.bin
            release/scout80-dash-${{ env.VERSION }}-full.bin
          body: |
            **Install:** the web installer at https://robertwa1974.github.io/evScout--dash/ (Chrome/Edge, UART DIP switch on USB). Leave "Erase device" unticked to keep settings and the odometer.

            **Update over WiFi:** upload `firmware.bin` at `http://192.168.4.1/update` on the dash's `Scout80-Config` hotspot.

            `scout80-dash-${{ env.VERSION }}-full.bin` is a full image for esptool at offset 0x0 on a blank board. It **erases settings and the odometer**, and the WiFi update page rejects it.
